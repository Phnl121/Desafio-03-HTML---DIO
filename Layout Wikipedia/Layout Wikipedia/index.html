<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wikipedia, a enciclopédia livre</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div class="logo">
          <img src="assets/images/wikipedia.png" alt="Logo da Wikipedia" />
          <div class="logo-title">
            <span class="logo-text">Wikipedia</span>
            <span class="logo-subtext">A enciclopédia livre</span>
          </div>
        </div>

        <div class="search-bar">
          <input type="text" placeholder="Pesquisar na Wikipedia" />
          <button type="submit" class="search-button">Pesquisar</button>
        </div>

        <div class="account">
          <a href="#"><span>Entrar</span></a>
          <div class="account-logo">
            <a href="#"
              ><img src="assets/images/perfil.png" alt="Ícone de usuário"
            /></a>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
